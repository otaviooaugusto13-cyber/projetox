# Render Blueprint: site estático (front-end) + hub de telemetria (API). Os agentes Python rodam na SUA rede.
services:
  # ---- Hub de telemetria Zero-Trust (recebe heartbeats assinados dos agentes e empurra o estado ao painel) ----
  - type: web
    name: command-center-hub
    runtime: python
    rootDir: hub
    plan: free                       # free "dorme" sem tráfego; os heartbeats dos agentes o acordam. Para 24/7 use um plano pago.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k gthread -w 1 --threads 40 --timeout 120 -b 0.0.0.0:$PORT "cc_hub.server:create_app()"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CC_MASTER_KEY
        generateValue: true          # gerado pelo Render; copie-o p/ rodar `python -m cc_hub enroll` localmente
      - key: CC_VIEWER_TOKEN
        generateValue: true          # token de leitura do painel (⚙ → Hub de telemetria)
      - key: CC_AGENTS
        value: "pc-principal:PC Principal,notebook:Notebook"
      - key: CC_ALLOWED_ORIGINS
        value: "https://tablet-oq65.onrender.com"      # URL do painel. SEM isso o navegador bloqueia o painel (CORS). Vários: separe por vírgula
      - key: CC_TRUST_PROXY
        value: "1"

  # ---- Front-end (PWA) ----
  - type: web
    name: command-center
    runtime: static
    staticPublishPath: ./web
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(self), geolocation=(), payment=(), usb=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; connect-src 'self' https: http: wss: ws:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
