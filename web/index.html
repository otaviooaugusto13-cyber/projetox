<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis · Command Center</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060a10">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="application-name" content="Jarvis">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="css/hud.css">
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="clk"><b id="clkT">--:--</b><span id="clkD">&nbsp;</span></div>
    <nav class="seg" aria-label="Seções">
      <button class="on" data-v="home">Início</button>
      <button data-v="devices">Aparelhos</button>
      <button data-v="net">Rede</button>
      <button data-v="fleet">Frota</button>
    </nav>
    <div class="bar-r">
      <span class="link" id="link" role="status"><i></i><span id="linkTxt">conectando…</span></span>
      <button class="ibtn" id="btnCfg" aria-label="Configurações">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- ============ INÍCIO ============ -->
    <section class="home" id="v-home">
      <aside class="col" id="netCol" aria-label="Rede">
        <h2>Rede</h2>
        <div class="verdict" id="netVerdict" data-s="wait">Verificando…</div>
        <p class="sub" id="netSub">&nbsp;</p>
        <dl class="kv">
          <div><dt id="kvNetL">Internet</dt><dd id="kvNet">—</dd></div>
          <div><dt id="kvGwL">Roteador</dt><dd id="kvGw">—</dd></div>
          <div><dt>Na rede local</dt><dd id="kvLan">—</dd></div>
        </dl>
        <p class="foot" id="netFoot">Medido pelo PC onde o agente roda.</p>
      </aside>

      <div class="stage">
        <button class="core" id="core" data-state="idle" aria-label="Falar com o Jarvis">
          <svg viewBox="0 0 400 400" aria-hidden="true">
            <defs>
              <radialGradient id="cg" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="var(--core-hi)" stop-opacity=".95"/>
                <stop offset=".45" stop-color="var(--core)" stop-opacity=".35"/>
                <stop offset="1" stop-color="var(--core)" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <circle class="halo" cx="200" cy="200" r="190" fill="url(#cg)"/>
            <g class="spin s1"><circle cx="200" cy="200" r="184" class="ticks"/></g>
            <g class="spin s2 rev"><circle cx="200" cy="200" r="160" class="arcs"/></g>
            <g class="spin s3"><circle cx="200" cy="200" r="134" class="thin"/></g>
            <circle class="voice" cx="200" cy="200" r="104"/>
            <g class="spin s4 rev"><polygon class="hex" points="200,128 262,164 262,236 200,272 138,236 138,164"/></g>
            <circle class="disc" cx="200" cy="200" r="52"/>
            <text x="200" y="207" class="word" text-anchor="middle">JARVIS</text>
          </svg>
        </button>
        <p class="hint" id="coreHint" role="status">Toque no núcleo para falar</p>
        <div class="talk" aria-live="polite">
          <p class="heard" id="heard">&nbsp;</p>
          <p class="said" id="said">&nbsp;</p>
        </div>
        <form class="typebox" id="typeForm" autocomplete="off">
          <input id="typeIn" type="text" placeholder="Digitar um comando" aria-label="Digitar um comando para o Jarvis" enterkeyhint="send">
          <button class="ibtn" aria-label="Enviar comando"><svg viewBox="0 0 24 24"><path d="m5 12 14-7-5 14-2-6z"/></svg></button>
        </form>
      </div>

      <aside class="col" id="devCol" aria-label="Aparelhos">
        <h2 id="devTitle">Aparelhos</h2>
        <p class="sub" id="devSum">&nbsp;</p>
        <ul class="mini" id="devMini"></ul>
        <button class="more" id="devAll" hidden>Ver todos os aparelhos</button>
      </aside>

      <div class="rout" id="routStrip" hidden></div>
    </section>

    <!-- ============ APARELHOS ============ -->
    <section class="devs" id="v-devices" hidden>
      <div class="dhead">
        <h1>Aparelhos</h1>
        <div class="filters" id="filters"></div>
        <button class="btn" id="devAdd">Novo aparelho</button>
      </div>
      <div class="dgrid" id="dgrid"></div>
    </section>

    <!-- ============ REDE LOCAL (dispositivos reais, tempo real) ============ -->
    <section class="devs" id="v-net" hidden>
      <div class="dhead">
        <h1>Rede local</h1>
        <span class="nsum" id="netSummary" role="status">&nbsp;</span>
      </div>
      <p class="noitems" id="nempty" hidden></p>
      <div class="dgrid" id="ngrid"></div>
    </section>

    <!-- ============ FROTA (hardware dos PCs, via hub) ============ -->
    <section class="devs" id="v-fleet" hidden>
      <div class="dhead">
        <h1>Frota</h1>
        <span class="nsum" id="fleetSum" role="status">&nbsp;</span>
      </div>
      <p class="noitems" id="fleetMsg" hidden></p>
      <div class="dgrid" id="fgrid"></div>
      <h3 class="fev-h" id="fevH" hidden>Eventos de segurança</h3>
      <ul class="fev" id="fev"></ul>
    </section>
  </main>
</div>

<!-- ============ CONFIGURAÇÕES ============ -->
<dialog id="cfg" aria-labelledby="cfgTitle">
  <div class="sbox">
    <div class="shead">
      <h2 id="cfgTitle">Configurações</h2>
      <button class="ibtn" id="cfgClose" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sbody">
      <nav class="stabs" id="cfgTabs">
        <button class="on" data-t="devs">Aparelhos</button>
        <button data-t="conn">Conexão</button>
        <button data-t="voice">Jarvis</button>
        <button data-t="integ">Integrações</button>
      </nav>
      <div class="spane" id="p-devs"></div>
      <div class="spane" id="p-conn" hidden></div>
      <div class="spane" id="p-voice" hidden></div>
      <div class="spane" id="p-integ" hidden></div>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="js/hud-core.js"></script>
<script src="js/jarvis-nlu.js"></script>
<script src="js/jarvis.js"></script>
<script src="js/hud-home.js"></script>
<script src="js/hud-fleet.js"></script>
<script src="js/hud-settings.js"></script>
</body>
</html>
